<!doctype html>
<html lang="en" data-mode="classic">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#15100c" />
    <meta name="description" content="NextMove — learn chess from your very first move. Lessons, a coach that explains, computer opponents and online play." />
    <title>NextMove — Learn Chess</title>
    <script>
      // Apply the saved Classic/Kids style before first paint (avoids a flash).
      try {
        var s = JSON.parse(localStorage.getItem('nextmove:settings') || '{}')
        if (s.mode) document.documentElement.dataset.mode = s.mode
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
